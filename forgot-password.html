<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | easyBuy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div><main class="auth-wrap"><div class="auth-card">
<div id="email-section"><h1>Forgot Password</h1><p class="muted">Enter your registered email address.</p><label>Email Address</label><input type="email" id="email" placeholder="Enter registered email"><button id="verify-email-btn" class="btn primary full">Continue</button></div>
<div id="security-section" style="display:none"><h1>Security Verification</h1><label>Security question</label><select id="security-question"><option value="1">What is your favorite color?</option><option value="2">What is your childhood nickname?</option><option value="3">What is your favorite Person's name?</option></select><label>Your answer</label><input type="text" id="security-answer" placeholder="Enter your answer"><button id="verify-answer-btn" class="btn primary full">Continue</button></div>
<div id="reset-section" style="display:none"><h1>Reset Password</h1><label>New Password</label><input type="password" id="new-password" placeholder="Enter new password"><label>Confirm Password</label><input type="password" id="confirm-password" placeholder="Confirm new password"><button id="reset-password-btn" class="btn primary full">Update Password</button></div>
<p id="form-message" class="form-message"></p></div></main><div id="site-footer"></div>
<script src="js/common.js"></script>
<script src="js/forgot.js"></script>
</body>
</html>
