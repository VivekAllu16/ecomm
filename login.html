<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | easyBuy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div><main class="auth-wrap"><form class="auth-card" id="f"><h1>Welcome Back</h1><p class="muted">Log in to continue shopping.</p>
<label for="email">Email Address</label><input id="email" type="email" placeholder="abcd@gmail.com" required>
<label for="password">Password</label><input id="password" type="password" placeholder="Enter your password" required>
<p class="forgot-password"><a href="forgot-password.html">Forgot Password?</a></p><button class="btn primary full" style="margin-top:0" type="submit">Log In</button>
<p class="form-message" id="m"></p><p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p></form></main><div id="site-footer"></div>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
