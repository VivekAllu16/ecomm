<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart | easyBuy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div><main class="container page-main"><h1>Shopping Cart</h1><p class="muted">Review your items before checkout.</p><div class="cart-layout"><section id="cart-items" class="cart-items"></section>
<aside class="panel order-summary"><h2>Order Summary</h2><div class="summary-line"><span>Subtotal</span><b id="cart-subtotal">₹0</b></div><div class="summary-line"><span>Delivery</span><b id="delivery-cost">Free</b></div><div class="summary-line total"><span>Total</span><b id="cart-total">₹0</b></div><button class="btn primary full" id="checkout-btn" style="margin-top:0">Place Order</button></aside></div></main><div id="site-footer"></div>
<script src="js/common.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
